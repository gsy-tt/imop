name: Build OpenWrt for BE6500

on:
  push:
    branches: [ openwrt-24.10 ]  # 监听您仓库的 openwrt-24.10 分支
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  build:
    runs-on: ubuntu-22.04  # 指定具体的 Ubuntu 版本，确保环境一致性    
    steps:
      - name: 加载仓库
        uses: actions/checkout@v4
        with:
          repository: gsy-tt/imop  # 使用您的仓库
          ref: openwrt-24.10  # 指定 openwrt-23.05 分支
          fetch-depth: 0  # 获取完整的仓库历史，确保所有提交可用

      - name: apt-get 安装依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y  build-essential ccache ecj fastjar file g++ gawk gettext git \
            java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-distutils python3-setuptools python3-dev rsync subversion swig \
            time unzip wget xmlto zlib1g-dev lib32z1 lib32stdc++6 flex bison quilt libtool automake autoconf texinfo \
            libglib2.0-dev libarchive-dev pkg-config libz-dev libltdl-dev libc6-dev-i386 \
            g++-multilib libncurses5-dev libreadline-dev libyaml-dev \
            python3-dev python3-pip python3-setuptools python3-wheel

      - name: 缓存下载源码
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ runner.os }}-openwrt-dl-${{ hashFiles('Config.in', 'Makefile') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-dl-
      
      - name: 缓存 feeds
        uses: actions/cache@v4
        with:
          path: feeds
          key: ${{ runner.os }}-openwrt-feeds-${{ hashFiles('feeds.conf', 'feeds/*') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-feeds-
      
      - name: 缓存工具链（快速恢复）
        uses: actions/cache@v4
        with:
          path: |
            $(find build_dir -name "toolchain-*" -type d 2>/dev/null | tr '\n' '\n')
            $(find staging_dir -name "toolchain-*" -type d 2>/dev/null | tr '\n' '\n')
          key: ${{ runner.os }}-openwrt-toolchain-${{ hashFiles('.config', 'toolchain/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-toolchain-
            ${{ runner.os }}-openwrt-
      
      - name: 检查工具链是否存在
        id: check-toolchain
        run: |
          if find build_dir -name "toolchain-*" -type d -exec test -f {}/.built \; -quit; then
            echo "toolchain_ready=true" >> $GITHUB_OUTPUT
          else
            echo "toolchain_ready=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 尝试下载跨运行缓存
        if: steps.check-toolchain.outputs.toolchain_ready == 'false'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: toolchain-cache
          path: ./
      
      - name: 编译工具链（如果需要）
        if: steps.check-toolchain.outputs.toolchain_ready == 'false'
        run: |
          make toolchain/compile -j$(nproc) V=sc CC="ccache gcc" CXX="ccache g++"
          find build_dir -name "toolchain-*" -type d -exec touch {}/.built \;
      
      - name: 上传工具链缓存（仅当新编译时）
        if: steps.check-toolchain.outputs.toolchain_ready == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-cache
          path: |
            $(find build_dir -name "toolchain-*" -type d 2>/dev/null | tr '\n' '\n')
            $(find staging_dir -name "toolchain-*" -type d 2>/dev/null | tr '\n' '\n')
          retention-days: 30
      
      - name: 清理系统（在缓存之后）
        run: |
          # 清理apt缓存
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          
          # 删除不需要的大型工具
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/microsoft/powershell
          
          # 清理临时目录
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*
          
          echo "清理完成: $(df -h /)"
      
      - name: 编译内核和目标系统
        run: |
          make target/compile -j$(nproc) V=sc CC="ccache gcc" CXX="ccache g++"
      
      - name: 编译所有软件包
        run: |
          #make package/compile -j$(nproc) V=sc CC="ccache gcc" CXX="ccache g++"
          make package/compile -j1 V=sc CC="ccache gcc" CXX="ccache g++"
      - name: 生成软件包索引文件（Packages和Packages.gz），用于后续安装和更新
        run: |
          make package/index  V=sc

      - name: 生成最终固件镜像（如openwrt-<device>.bin），包含内核、系统和选定的软件包
        run: |
          #make target/linux/ipq807x/image V=1
          make -j1 V=sc
      - name: Collect artifacts
        id: collect
        run: |
          # 使用find命令查找所有目标目录
          TARGET_DIR=$(find bin/targets -mindepth 2 -maxdepth 2 -type d | head -1)
          if [ -n "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
            FILES=$(find . -name "*.bin" -o -name "*.img.gz" | sed 's|^\.\/||' | tr '\n' ' ')
            echo "artifact_files=$(echo $FILES | tr ' ' ',')" >> $GITHUB_ENV
            echo "artifact_count=$(echo $FILES | wc -w)" >> $GITHUB_ENV
            find bin/ -name "*.bin"
            find bin/ -name "*.img*"
          else
            echo "artifact_files=" >> $GITHUB_ENV
            echo "artifact_count=0" >> $GITHUB_ENV
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        #if: env.artifact_count > 0
        with:
          name: be6500-firmware
          path: |
            $(find bin/targets -name "*.bin" 2>/dev/null | tr '\n' '\n')
            $(find bin/targets -name "*.img.gz" 2>/dev/null | tr '\n' '\n')
            $(find bin/targets -type d -name "packages" 2>/dev/null | tr '\n' '\n')
          retention-days: 7

      - name: Display firmware information
        run: |
          echo "固件编译完成！"
          echo "下载链接将在 Actions 页面的 Artifacts 部分显示"
          echo "预计可用文件：.bin、.img.gz 格式的固件文件"
